name: Release workflow
run-name: Release workflow triggered by ${{ github.event_name }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
  pull_request:
    branches: 
      - master
    types: 
      - closed

jobs:
  cd:
    if: github.event.pull_request.merged == true
    name: Call CD workflow
    uses: ./.github/workflows/cd.yml

  release:
    if: github.event.pull_request.merged == true
    name: Create release
    runs-on: ubuntu-24.04
    needs: cd
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact - Linux
        uses: actions/download-artifact@v8
        with:
          path: binaries

      - name: List artifacts
        run: ls -la binaries
        
      - name: Validate for release
        uses: mrachuta/github-action-release-on-pr-label@master
        id: validate_for_release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pull_request_id: ${{ github.event.pull_request.number }}
          mode: validate
          debug: ${{ runner.debug }}

      - name: Create packages
        run: |
          #!/usr/bin/env bash
          set -xeu -o pipefail

          NEW_TAG=${{ steps.validate_for_release.new_tag }}
          ROOT_DIR=$PWD
          cp README.md binaries/pyresizer-binary-Linux/
          cp README.md binaries/pyresizer-binary-Windows/
          echo "Create Linux release..."
          cd "${ROOT_DIR}/binaries/pyresizer-binary-Linux/" && tar -cvf "pyresizer-${NEW_TAG}-linux-x64.tar" ./* && mv ./*.tar "${ROOT_DIR}/"
          echo "Create Windows release..."
          cd "${ROOT_DIR}/binaries/pyresizer-binary-Windows/" && zip -vr "pyresizer-${NEW_TAG}-windows-x64.zip" ./* && mv ./*.zip "${ROOT_DIR}/"

      - name: Create release
        uses: mrachuta/github-action-release-on-pr-label@master
        id: create_release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pull_request_id: ${{ github.event.pull_request.number }}
          mode: release
          custom_tag: ${{ steps.validate_for_release.new_tag }}
          assets: "pyresizer-*-linux-x64.tar,pyresizer-*-windows-x64.zip"
          debug: ${{ runner.debug }}
