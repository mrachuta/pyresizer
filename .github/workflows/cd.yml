name: CD workflow
run-name: CD workflow triggered by ${{ github.event_name }} to ${{ github.ref_name }}
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: 
      - master
    types: 
      - opened
      - labeled
      - unlabeled
  issue_comment:
    types: 
      - created

jobs:
  ci:
    name: Call CI workflow
    uses: ./.github/workflows/ci.yml

  build-bins:
    name: Build binaries
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: "pip"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Build binary
        run: pyinstaller -F pyresizer.py

      - name: Upload artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: pyresizer-binary-${{ runner.os }}
          path: dist
          retention-days: 2
          overwrite: true

  e2e-tests:
    name: Run e2e tests
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    needs: build-bins
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ vars.PYTHON_VERSION }}
          cache: "pip"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          name: pyresizer-binary-${{ runner.os }}

      - name: Check binary (Linux)
        if: runner.os == 'Linux'
        run: chmod +x ./dist/pyresizer && ./dist/pyresizer -h

      - name: Check binary (Windows)
        if: runner.os == 'Windows'
        run: ./dist/pyresizer.exe -h

      - name: Run E2E tests
        run: pytest tests/e2etests.py

  validate-for-release:
    name: Validate for release
    if: |
      (
        github.event_name == 'pull_request' &&
          (
            github.event.action == 'opened' ||
            github.event.action == 'labeled' ||
            github.event.action == 'unlabeled'
          )
      ) || (
        github.event_name == 'issue_comment' &&
        startsWith(
          github.event.comment.body, '/validate-for-release'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      statuses: write
    steps:
      - name: Validate for release
        uses: mrachuta/github-action-release-on-pr-label@master
        id: validate-for-release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pull_request_id: ${{ github.event.pull_request.number || github.event.issue.number }}
          mode: validate
          debug: ${{ runner.debug }}
